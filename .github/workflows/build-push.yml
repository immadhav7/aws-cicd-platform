# Temporary stand-in for CodeBuild (see infra/github-oidc/README.md).
# Same logic as buildspec.yml: test, build, push to ECR tagged with the 7-character commit SHA.
name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "infra/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-cicd-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run unit tests
        working-directory: app
        run: python -m pytest -q

  build-push:
    needs: test
    # Pull requests only run the tests. Nothing is pushed to AWS from a PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request the OIDC token AWS verifies
      contents: read
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: remove once the role can be assumed.
      - name: Debug - show OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref, job_workflow_ref}'
      
      - name: Debug - show role ARN
        run: echo "[${{ vars.AWS_ROLE_ARN }}]" | sed 's/./& /g'
        
      - name: Sign in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region:
