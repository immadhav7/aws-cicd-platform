# Temporary stand-in for CodeBuild (see infra/github-oidc/README.md).
# Same logic as buildspec.yml: test, build, push to ECR tagged with the 7-character commit SHA.
name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "infra/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-cicd-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run unit tests
        working-directory: app
        run: python -m pytest -q

  build-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"

          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${TAG}" >/dev/null 2>&1; then
            echo "Image ${TAG} already exists, skipping build."
            echo "Image \`${TAG}\` already existed, nothing pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          docker build --build-arg BUILD_ID="${TAG}" -t "${IMAGE}" app/
          docker push "${IMAGE}"
          echo "Pushed \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
